name: MediaCoder
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: '14.0'
targets:
  MediaCoder:
    type: application
    platform: macOS
    sources: [Sources/MediaCoder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MediaCoder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_CFBundleDisplayName: Media Coder
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        ENABLE_APP_SANDBOX: NO
